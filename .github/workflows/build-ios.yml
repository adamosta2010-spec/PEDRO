# Builds Pedro into an installable .ipa on a free GitHub macOS machine.
# No Mac needed on your side, and no Apple Developer account: the .ipa comes out
# unsigned, and AltStore signs it with your free Apple ID.
#
# However it ends, the log is committed to build-log/last-build.txt so the error
# can be read straight from the repo instead of dug out of the Actions UI.

name: Build iPhone app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pick the newest Xcode
        run: |
          ls /Applications | grep -i "^Xcode" || true
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "using $NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer" || true

      - name: Toolchain
        run: |
          exec > >(tee -a build.log steps.log) 2>&1
          echo "node   $(node -v)"
          echo "npm    $(npm -v)"
          echo "xcode  $(xcodebuild -version | head -1)"
          echo "ruby   $(ruby -v 2>/dev/null || echo missing)"
          echo "pod    $(pod --version 2>/dev/null || echo MISSING)"
          echo "ios dir present: $(test -d ios && echo YES || echo no)"

      - name: CocoaPods
        run: |
          exec > >(tee -a build.log steps.log) 2>&1
          if ! command -v pod >/dev/null 2>&1; then
            echo "installing cocoapods..."
            sudo gem install cocoapods --no-document || brew install cocoapods
          fi
          pod --version

      - name: Install Capacitor
        run: |
          exec > >(tee -a build.log steps.log) 2>&1
          npm install
          echo "--- capacitor packages ---"
          npm ls @capacitor/core @capacitor/ios @capacitor/cli || true

      - name: Check the web app is there
        run: |
          exec > >(tee -a build.log steps.log) 2>&1
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          grep -o 'var BUILD = "[^"]*"' dist/index.html | head -1

      - name: Create the iOS project
        run: |
          exec > >(tee -a build.log steps.log) 2>&1
          npx cap add ios

      - name: Sync the web app into it
        run: |
          exec > >(tee -a build.log steps.log) 2>&1
          npx cap sync ios

      - name: Add the native bridge
        run: |
          exec > >(tee -a build.log steps.log) 2>&1
          cp native/PedroNative.swift ios/App/App/PedroNative.swift
          cp native/MainViewController.swift ios/App/App/MainViewController.swift
          ls -l ios/App/App/
          # a copied file is not a built file - register it with the Xcode project
          sudo gem install xcodeproj --no-document || gem install xcodeproj --no-document
          ruby native/add_source.rb
          # the page has no bundler, so Capacitor's own JavaScript has to ride along
          node native/add_capacitor_js.js
          # a compiled plugin still has to be handed to the bridge
          node native/patch_storyboard.js

      - name: Microphone and speech permissions
        run: |
          exec > >(tee -a build.log steps.log) 2>&1
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Pedro listens when you tap the microphone.'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string 'Pedro turns what you say into text.'" "$PLIST" || true
          # tapping Take Photo in the picker crashes the app without this
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Pedro uses the camera when you take a photo to send it.'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Pedro opens your photos when you attach one.'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 'Pedro saves pictures it makes for you.'" "$PLIST" || true
          # asked for before he is allowed to change his own code
          /usr/libexec/PlistBuddy -c "Add :NSFaceIDUsageDescription string 'Pedro asks for your face before changing his own code.'" "$PLIST" || true
          # listening while the app is behind something else needs this declared
          plutil -replace UIBackgroundModes -json '["audio"]' "$PLIST"
          echo "--- background modes in the source plist ---"
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST" | grep -q audio || {
            echo "could not declare background audio in $PLIST"; exit 1; }
          echo "--- permissions now declared ---"
          /usr/libexec/PlistBuddy -c "Print" "$PLIST" | grep -i usagedescription || true

      - name: Build (unsigned)
        run: |
          exec > >(tee -a build.log) 2>&1
          cd ios/App
          xcodebuild \
            -quiet \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Verify the native code is actually in the binary
        run: |
          exec > >(tee -a build.log steps.log) 2>&1
          BIN=ios/App/build/Build/Products/Release-iphoneos/App.app/App
          echo "checking $BIN"
          for s in PedroNative FoundationModels SFSpeechRecognizer; do
            if strings -a "$BIN" | grep -q "$s"; then echo "  FOUND    $s"; else echo "  MISSING  $s"; fi
          done
          strings -a "$BIN" | grep -q PedroNative || { echo "native bridge did not compile in"; exit 1; }
          APP=ios/App/build/Build/Products/Release-iphoneos/App.app
          test -f "$APP/public/capacitor.js" || { echo "capacitor.js never made it into the app"; exit 1; }
          grep -q 'src="capacitor.js"' "$APP/public/index.html" || { echo "the page does not load capacitor.js"; exit 1; }
          echo "  the page loads Capacitor's JavaScript"
          strings -a "$BIN" | grep -q MainViewController || { echo "the plugin registration did not compile in"; exit 1; }
          strings -a "$BIN" | grep -q registerPluginInstance || { echo "nothing registers the plugin"; exit 1; }
          echo "  the plugin is registered with the bridge"
          # a permission the app never declares is a crash the moment it is used
          PL=ios/App/build/Build/Products/Release-iphoneos/App.app/Info.plist
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PL" | grep -q audio || { echo "background audio is not declared"; exit 1; }
          echo "  background listening is declared"
          for k in NSMicrophoneUsageDescription NSSpeechRecognitionUsageDescription NSCameraUsageDescription NSPhotoLibraryUsageDescription; do
            if /usr/libexec/PlistBuddy -c "Print :$k" "$PL" >/dev/null 2>&1; then
              echo "  declared $k"
            else
              echo "  MISSING  $k"; exit 1
            fi
          done

      - name: Package as .ipa
        run: |
          exec > >(tee -a build.log steps.log) 2>&1
          cd ios/App/build/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -R App.app Payload/
          zip -qry Pedro.ipa Payload
          ls -lh Pedro.ipa

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Pedro-ipa
          path: ios/App/build/Build/Products/Release-iphoneos/Pedro.ipa
          retention-days: 30

      - name: Publish the log
        if: always()
        run: |
          mkdir -p build-log
          { echo "=== the build steps ==="; cat steps.log 2>/dev/null; 
            echo; echo "=== the end of the build output ==="; tail -c 60000 build.log; 
          } > build-log/last-build.txt 2>/dev/null || echo "no log captured" > build-log/last-build.txt
          printf '\n=== finished: %s at %s ===\n' "${{ job.status }}" "$(date -u)" >> build-log/last-build.txt
          git config user.name "build"
          git config user.email "build@users.noreply.github.com"
          git add -f build-log/last-build.txt
          git commit -m "build log: ${{ job.status }}" || exit 0
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main || true
